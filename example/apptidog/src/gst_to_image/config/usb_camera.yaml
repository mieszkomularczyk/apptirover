# Configuration for gst_to_image used as a drop-in replacement for usb_cam on
# the RGB camera, reading the device directly via GStreamer's v4l2src instead
# of the usb_cam driver. Pipeline terminates in an appsink named 'imagesink'
# emitting BGR (matches usb_cam's mjpeg2rgb + resolution/fps settings).

usb_camera:
  ros__parameters:
    frame_id: "camera_rgb"
    pipeline: |
      v4l2src device=/dev/v4l/by-id/usb-4K_USB_CAMERA_HD_USB_CAMERA_01.00.00-video-index0 !
      image/jpeg,width=1280,height=720,framerate=30/1 !
      jpegdec !
      videoconvert !
      video/x-raw,format=BGR !
      appsink name=imagesink sync=false drop=true max-buffers=1
