# Configuration for image_to_gst - UDP streaming

stream:
  ros__parameters:
    compressed: False
    topic: "/osd/image_raw"
    pipeline: |
      appsrc name=imagesrc do-timestamp=true is-live=true format=time max-bytes=0 block=false !
      queue max-size-buffers=3 max-size-time=0 max-size-bytes=0 leaky=downstream !
      videoconvert n-threads=4 !
      videoscale n-threads=4 method=0 !
      video/x-raw,format=I420,width=1280,height=720,framerate=30/1 !
      x264enc tune=zerolatency speed-preset=ultrafast threads=4 bitrate=6000 key-int-max=15 bframes=0 aud=false byte-stream=true sliced-threads=true rc-lookahead=0 sync-lookahead=0 vbv-buf-capacity=120 !
      h264parse config-interval=-1 !
      rtph264pay config-interval=-1 pt=96 mtu=1400 !
      udpsink host=<IP> port=5000 sync=false async=false max-lateness=-1 qos=false
